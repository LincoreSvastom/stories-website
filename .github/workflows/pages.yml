name: Publish approved Stories website
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After owner review and approval, type PUBLISH_STORIES'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stories-pages
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH_STORIES'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject incomplete documents and stage public assets
        run: python scripts/stage.py --publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy approved website
        id: deployment
        uses: actions/deploy-pages@v4
